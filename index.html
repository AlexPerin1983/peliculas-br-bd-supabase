      var h = window.location.hostname;
      return h === 'localhost'
        || h === '127.0.0.1'

        || /^192\.168\./.test(h)
        || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
    })();

          .catch(() => {});

  <script>
    // Recupera com seguranca quando uma versao antiga do PWA tenta abrir um
    // bundle que deixou de existir apos uma publicacao. Mantem IndexedDB,
    // localStorage e toda a fila offline do usuario intactos.
    (function () {
      var RECOVERY_KEY = 'peliculas-br-asset-recovery-at';
      var RECOVERY_WINDOW_MS = 2 * 60 * 1000;
      var UPDATE_RELOAD_FALLBACK_MS = 4 * 1000;
      var TECHNICAL_STEP_TIMEOUT_MS = 5 * 1000;
      var TECHNICAL_CACHE_PREFIXES = [
        'peliculas-br-bd-',
        'peliculas-brasil-',
        'app-cache-',
        'workbox-'
      ];
      var TECHNICAL_CACHE_NAMES = ['pages-cache', 'assets-cache', 'images-cache'];
      var recoveryInProgress = false;

      function getLastRecoveryAt() {
        try {
          return Number(window.sessionStorage.getItem(RECOVERY_KEY) || 0);
        } catch (_error) {
          return 0;
        }
      }

      function setLastRecoveryAt(value) {
        try {
          window.sessionStorage.setItem(RECOVERY_KEY, String(value));
        } catch (_error) {
          // O modo privado pode bloquear sessionStorage; a guarda em memoria
          // ainda impede mais de uma tentativa nesta pagina.
        }
      }

      function isTechnicalCacheName(name) {
        return TECHNICAL_CACHE_NAMES.indexOf(name) !== -1
          || TECHNICAL_CACHE_PREFIXES.some(function (prefix) {
            return name.indexOf(prefix) === 0;
          });
      }

      function withTimeout(promise, fallbackValue) {
        return new Promise(function (resolve, reject) {
          var settled = false;
          var timeoutId = window.setTimeout(function () {
            settled = true;
            resolve(fallbackValue);
          }, TECHNICAL_STEP_TIMEOUT_MS);

          Promise.resolve(promise).then(function (value) {
            if (settled) return;
            settled = true;
            window.clearTimeout(timeoutId);
            resolve(value);
          }, function (error) {
            if (settled) return;
            settled = true;
            window.clearTimeout(timeoutId);
            reject(error);
          });
        });
      }

      function clearTechnicalCaches() {
        if (!('caches' in window)) return Promise.resolve();

        var cleanup = window.caches.keys()
          .then(function (names) {
            return Promise.all(names
              .filter(isTechnicalCacheName)
              .map(function (name) { return window.caches.delete(name); }));
          })
          .catch(function () {});

        return withTimeout(cleanup, []);
      }

      function replaceWithFreshUrl() {
        if (window.__peliculasReloading) return;
        window.__peliculasReloading = true;
        var url = new URL(window.location.href);
        url.searchParams.set('_app_refresh', String(Date.now()));
        window.location.replace(url.toString());
      }

      function waitForWorkerInstallation(worker) {
        if (!worker || worker.state === 'installed' || worker.state === 'activated' || worker.state === 'redundant') {
          return Promise.resolve(true);
        }

        return new Promise(function (resolve) {
          var timeoutId;

          function finish(completed) {
            worker.removeEventListener('statechange', handleStateChange);
            if (timeoutId) window.clearTimeout(timeoutId);
            resolve(completed);
          }

          function handleStateChange() {
            if (worker.state === 'installed' || worker.state === 'activated' || worker.state === 'redundant') {
              finish(true);
            }
          }

          worker.addEventListener('statechange', handleStateChange);
          timeoutId = window.setTimeout(function () { finish(false); }, 5000);
        });
      }

      function requestUpdatedWorkerActivation() {
        if (!('serviceWorker' in navigator)) return Promise.resolve(false);

        return navigator.serviceWorker.getRegistration()
          .then(function (registration) {
            if (!registration) return false;

            function activateWaitingWorker() {
              var waitingWorker = registration.waiting;
              if (!waitingWorker) return false;

              waitingWorker.postMessage({ type: 'SKIP_WAITING' });
              return true;
            }

            // Se a versao nova ja esta pronta, ativa sem depender da rede.
            if (activateWaitingWorker()) return true;

            return withTimeout(registration.update(), undefined)
              .catch(function (error) {
                if (activateWaitingWorker()) return true;
                throw error;
              })
              .then(function (activatedDuringUpdate) {
                if (activatedDuringUpdate === true || activateWaitingWorker()) return true;

                if (!registration.installing) return false;

                return waitForWorkerInstallation(registration.installing).then(function (installationFinished) {
                  if (!installationFinished) {
                    throw new Error('A nova versao ainda esta sendo instalada. Tente novamente.');
                  }
                  return activateWaitingWorker();
                });
              });
          });
      }

      function prepareFreshVersion() {
        return requestUpdatedWorkerActivation()
          .then(function (activationRequested) {
            // O worker novo limpa os caches antigos durante activate. Quando
            // nao existe worker aguardando, limpamos aqui antes de recarregar.
            if (activationRequested) return true;
            return clearTechnicalCaches().then(function () { return false; });
          });
      }

      function finishFreshUpdate(activationRequested) {
        if (!activationRequested) {
          replaceWithFreshUrl();
          return;
        }

        // controllerchange normalmente recarrega antes. Este e apenas o
        // fallback para navegadores que atrasam ou omitem esse evento.
        window.setTimeout(replaceWithFreshUrl, UPDATE_RELOAD_FALLBACK_MS);
      }

      window.__reloadPeliculasApp = replaceWithFreshUrl;

      function showRecoveryScreen() {
        function render() {
          if (document.getElementById('pwa-recovery-screen')) return;

          var screen = document.createElement('div');
          screen.id = 'pwa-recovery-screen';
          screen.setAttribute('role', 'alert');
          screen.style.cssText = [
            'position:fixed',
            'inset:0',
            'z-index:2147483647',
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'padding:24px',
            'background:#f8fafc',
            'font-family:Roboto,Arial,sans-serif',
            'color:#1e293b'
          ].join(';');
          screen.innerHTML = [
            '<div style="width:100%;max-width:420px;text-align:center">',
            '<div style="margin:0 auto 18px;width:56px;height:56px;border-radius:18px;background:#dbeafe;color:#2563eb;display:flex;align-items:center;justify-content:center;font-size:28px">&#8635;</div>',
            '<h1 style="margin:0 0 10px;font-size:22px;line-height:1.25">Vamos atualizar o aplicativo</h1>',
            '<p style="margin:0 0 22px;color:#64748b;font-size:15px;line-height:1.5">Uma nova versão foi publicada. Seus dados e trabalhos offline serão preservados.</p>',
            '<button id="pwa-recovery-button" type="button" style="width:100%;border:0;border-radius:14px;padding:14px 18px;background:#2563eb;color:#fff;font-size:16px;font-weight:600;cursor:pointer">Atualizar aplicativo</button>',
            '</div>'
          ].join('');
          document.body.appendChild(screen);

          document.getElementById('pwa-recovery-button').addEventListener('click', function () {
            var button = document.getElementById('pwa-recovery-button');
            button.disabled = true;
            button.textContent = 'Atualizando...';
            setLastRecoveryAt(Date.now());

            prepareFreshVersion()
              .then(finishFreshUpdate)
              .catch(function (error) {
                console.error('Nao foi possivel ativar a nova versao:', error);
                button.disabled = false;
                button.textContent = 'Tentar novamente';
              });
          });
        }

        if (document.body) {
          render();
        } else {
          document.addEventListener('DOMContentLoaded', render, { once: true });
        }
      }

      function recoverFromStaleAssets(reason) {
        if (window.__isLocalDevHost || recoveryInProgress) return;

        recoveryInProgress = true;
        var now = Date.now();
        var lastRecoveryAt = getLastRecoveryAt();

        if (lastRecoveryAt && now - lastRecoveryAt < RECOVERY_WINDOW_MS) {
          console.error('Falha ao carregar a nova versao depois da recuperacao:', reason);
          showRecoveryScreen();
          return;
        }

        console.warn('Atualizando arquivos tecnicos do aplicativo:', reason);
        setLastRecoveryAt(now);

        prepareFreshVersion()
          .then(finishFreshUpdate)
          .catch(showRecoveryScreen);
      }

      function isAssetUrl(value) {
        return typeof value === 'string' && value.indexOf('/assets/') !== -1;
      }

      function isStaleModuleMessage(value) {
        var message = String(value || '').toLowerCase();
        return message.indexOf('failed to fetch dynamically imported module') !== -1
          || message.indexOf('error loading dynamically imported module') !== -1
          || message.indexOf('importing a module script failed') !== -1
          || message.indexOf('chunkloaderror') !== -1;
      }

      window.addEventListener('vite:preloadError', function (event) {
        event.preventDefault();
        recoverFromStaleAssets('vite:preloadError');
      });

      window.addEventListener('error', function (event) {
        var target = event.target;
        var resourceUrl = target && (target.src || target.href);
        var isAssetSyntaxError = isAssetUrl(event.filename)
          && String(event.message || '').toLowerCase().indexOf('unexpected token') !== -1;
        if (isAssetUrl(resourceUrl) || isAssetSyntaxError
          || (isAssetUrl(event.filename) && isStaleModuleMessage(event.message))) {
          recoverFromStaleAssets(resourceUrl || event.filename || event.message);
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var message = reason && reason.message ? reason.message : reason;
        if (isStaleModuleMessage(message)) {
          event.preventDefault();
          recoverFromStaleAssets(message);
        }
      });

      window.__recoverPeliculasApp = recoverFromStaleAssets;
    })();
  </script>

  <script>
    // Service Worker Registration with Auto-Update
    if ('serviceWorker' in navigator) {
      const isLocalDev = window.__isLocalDevHost === true;
      let refreshing = false;

      // Listen for controlling service worker change
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        if (window.__reloadPeliculasApp) {
          window.__reloadPeliculasApp();
        } else {
          window.location.reload();
        }
      });

      window.addEventListener('load', async () => {
        if (isLocalDev) {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
            }

          } catch (error) {
            console.warn('Falha ao limpar Service Workers locais:', error);
          }
          return;
        }

        navigator.serviceWorker.register('/service-worker.js', {
          scope: '/'
        })
          .then(registration => {
            const notifyUpdateReady = () => {
              window.dispatchEvent(new Event('peliculas-br-pwa-update-ready'));
            };

            // Check for updates every 60 seconds
            setInterval(() => {
              registration.update().catch(error => {
                console.warn('Falha ao verificar atualizacao do aplicativo:', error);
              });
            }, 60000);

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;

              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  // Quando o novo SW estiver instalado e houver um controlador atual,
                  // notifica o banner global, inclusive na tela de login.
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    notifyUpdateReady();
                  }
                });
              }
            });

            if (registration.waiting) {
              notifyUpdateReady();
            }

            // Immediate update check, depois de registrar os listeners para
            // nao perder updatefound em conexoes rapidas.
            if (!registration.waiting) {
              registration.update().catch(error => {
                console.warn('Falha na verificacao inicial de atualizacao:', error);
              });
            }
          })
          .catch(error => {
            console.error('❌ Falha ao registrar Service Worker:', error);
          });
      });
    } else {
      console.warn('⚠️ Service Workers não são suportados neste navegador');
    }
  </script>
